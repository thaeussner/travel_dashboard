name: Build and deploy

on:
  push:
    branches: [main]          # every save from the dashboard is a push
  workflow_dispatch: {}       # "Run workflow" button
  schedule:
    - cron: "23 4 * * *"      # daily: moves "today" so planned travel becomes past travel

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Check data (issues are listed, never block the site)
        run: python -m travel_dashboard check || true
      - name: Build
        run: python -m travel_dashboard build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
