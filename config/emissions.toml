# Emission profiles. Read by travel_dashboard/profiles.py; reasoning in docs/METHODOLOGY.md.
#
# A number is fixed, or [low, central, high], sampled as a triangular distribution in the Monte
# Carlo. Each parameter is drawn once per draw and shared by every travel that uses it.
# `source` texts may link with [label](https://...); the site shows them as links.
# A travel row uses its mode's defaults, overlaid by the first [[vehicles]] entry whose `match`
# pattern (a regex, whole words, case-insensitive) is found in the row's `vehicle` text.
#
# Units
#   g_pkm       g CO2e per passenger-km at the factor's typical load (well-to-wheel)
#   g_vkm       g CO2e per vehicle-km (well-to-wheel)
#   kg_fuel_nm  kg fuel per nautical mile (ships)
#   fuels       kg CO2e per kg fuel (ships, planes) or per litre (cars, yachts), well-to-wheel
#   seats       default capacity when the row has no occ_max
#   lf          typical load factor (share of seats taken)

[meta]
version = "2026-10-18"

[fuels]
mgo = [3.80, 3.88, 3.95]        # per kg marine gas oil: IMO 4th GHG Study 3.206 + FuelEU Maritime upstream 14.4 g/MJ
hfo = [3.55, 3.68, 3.88]        # per kg residual fuel / VLSFO: IMO 3.114 + upstream
diesel = [3.18, 3.22, 3.29]     # per litre road diesel (EU B7): DESNZ 2025 average blend 3.18 … 100 % mineral 3.29
petrol = [2.65, 2.90, 2.95]     # per litre petrol (EU 95 E5): DESNZ 2025 average blend 2.65 … 100 % mineral 2.95
marine_diesel = [3.29, 3.33, 3.40]   # per litre, no biofuel: DESNZ 2025 mineral diesel 3.29, marine gas oil 3.40
jet_wtt = [0.50, 0.54, 0.65]    # upstream per kg jet fuel (myclimate P = 0.538)

[allocation]   # ferries: splitting a sailing between passengers and freight
source = "[ISO 14083:2023](https://www.iso.org/standard/78864.html) Annex G passenger equivalents ([CLECAT guide](https://www.clecat.org/media/clecat-guide-to-iso-14083---greenhouse-gas-emissions-in-the-transport-sector.pdf)); [DESNZ 2026 methodology](https://assets.publishing.service.gov.uk/media/6a2940543b15d05a7ce3202e/2026-GHG-conversion-factors-methodology-report.pdf) ferry masses"
pax_t = [0.08, 0.10, 0.10]      # passenger + luggage, tonnes (DESNZ 0.10, EN 16258 0.08)
car_peq = 1.3                   # ISO 14083 passenger equivalents per car
car_t = 1.25                    # DESNZ car mass, tonnes
truck_peq = 18                  # articulated truck
truck_t = 22.2                  # DESNZ freight unit incl. vehicle, tonnes
trailer_peq = [14, 15, 18]      # unaccompanied trailer 14 … articulated truck 18
trailer_t = [18.0, 22.2, 26.0]

[flight]
source = "Per-flight fuel model, calibrated to [DESNZ 2026](https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026) within ~10 % and checked against [ICAO](https://icec.icao.int/Methodology%20ICAO%20Carbon%20Emissions%20Calculator_v13_Final.pdf) and [myclimate](https://www.myclimate.org/en/information/about-myclimate/downloads/flight-emission-calculator/); non-CO2 after [Lee et al. 2021](https://doi.org/10.1016/j.atmosenv.2020.117834)"
uplift = [0.04, 0.08, 0.12]     # flown distance above great circle (DESNZ +8 %)
co2_per_kg = 3.16               # kg CO2 per kg jet fuel (ICAO)
nonco2_long = [1.2, 1.7, 3.0]   # multiplier on combustion CO2: GWP100 1.7 (Lee 2021) … GWP*/ERF ~3
nonco2_short = [1.0, 1.3, 2.0]  # jets under short_km spend less of the flight at cruise altitude
nonco2_turboprop = [1.0, 1.1, 1.4]   # turboprops cruise low, where contrails rarely form
short_km = 500
wide_from_km = 4000             # aircraft not named: wide-body from this distance

[flight.narrow]
label = "narrow-body jet"
match = ['a3(19|20|21)\w*', 'a220\w*', 'b?737\w*', 'e1[79]\d', 'e19\d', 'crj\w*', 'embraer']
seats = 180
lf = [0.80, 0.85, 0.92]         # IATA 2025: European carriers 84 %; easyJet 90 %; SWISS group 83 %
lto_kg = [550, 750, 950]        # taxi, take-off, climb and landing fuel per flight
cruise_kg_km = [2.4, 2.7, 3.0]
cargo = 0

[flight.wide]
label = "wide-body jet"
match = ['a3[3-5]\d\w*', 'a380', 'b?7[4678]7\w*', 'dreamliner']
seats = 350
lf = [0.78, 0.83, 0.88]
lto_kg = [1800, 2200, 2700]
cruise_kg_km = [6.0, 6.8, 7.6]
cargo = [0.06, 0.12, 0.20]      # share of fuel allocated to belly freight

[flight.turboprop]
label = "turboprop"
match = ['atr\w*', 'dash ?8', 'q400', 'turboprop', 'saab ?\d+']
seats = 72
lf = [0.60, 0.72, 0.85]
lto_kg = [140, 190, 250]
cruise_kg_km = [1.25, 1.45, 1.70]
cargo = 0

# ----------------------------------------------------------------------------------- modes
[modes.train]
kind = "factor"
label = "train (generic)"
g_pkm = [3, 15, 45]             # EEA/CE Delft (EU, 2018): high-speed 15.8, conventional 41.2; FR/CH grids far lower
seats = 400
lf = [0.45, 0.60, 0.75]
grade = "D"
source = "[EEA/CE Delft 2021](https://cedelft.eu/wp-content/uploads/sites/2/2021/05/CE_Delft_200258_Methodology_GHG_Efficiency_Transport_Modes.pdf) (EU 2018 data, location-based electricity)"

[modes.bus]
kind = "factor"
label = "local bus (generic)"
g_pkm = [60, 130, 160]          # DESNZ 2025: average local bus 130, outside London 157
seats = 60
lf = [0.12, 0.20, 0.30]         # DESNZ assumes ~11 passengers
grade = "D"
source = "[DESNZ 2025](https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2025) local bus"

[modes.coach]
kind = "factor"
label = "coach (generic)"
g_pkm = [25, 34, 48]            # FlixBus Iberia 27.2 · DESNZ 2025 34.3 · DESNZ 2026 ~48
seats = 50
lf = [0.35, 0.50, 0.70]
grade = "C"
source = "[DESNZ 2025](https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2025) coach; [FlixBus 2025](https://corporate.flix.com/wp-content/uploads/2026/03/2025-Avoided-Emissions-Methodology-Document.pdf)"

[modes.car]
kind = "vehicle"
label = "car (petrol, generic)"
fuel = "petrol"
g_vkm = [190, 209, 230]         # DESNZ 2025 average petrol car (diesel 215)
occupancy = [1.0, 1.6, 2.2]     # typical occupants (ADEME 1.6)
grade = "C"
source = "[DESNZ 2025](https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2025) passenger vehicles"

# Cars: size and fuel are read from the `vehicle` text (e.g. "Citroën C1 (95)" → small petrol).
# DESNZ 2025, per vehicle-km, well-to-wheel = combustion + fuel supply (g CO2e):
#   small:   petrol 143.1 + 40.2 = 183 · diesel 143.4 + 34.1 = 177 · hybrid 114.1 + 30.3 = 144
#   average: petrol 162.7 + 46.0 = 209 · diesel 173.0 + 41.5 = 215 · hybrid 128.3 + 33.2 = 161
# Fuel type barely changes g/km; it matters for logged litres (diesel ~11 % more CO2e per litre).
# Electric: ~0.19 kWh/km × the grid where it charges: CH/FR ~0.06, Spanish mainland ~0.15,
# Canary Islands ~0.6-0.7 kg/kWh (ULPGC; 19 % renewables in 2023, REE), so the range is wide.
[cars]
source = "[DESNZ 2025](https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2025) passenger vehicles by size and fuel (well-to-wheel)"
size_default = "average"
fuel_default = "petrol"
sizes.small = ['small', 'kleinwagen', 'citro[eë]n c[1-3]', 'peugeot [12]08', 'fiat (500|panda)', '(vw|volkswagen) (up|polo)',
               'seat (ibiza|mii)', 'renault (clio|twingo)', 'toyota (aygo|yaris)', 'kia (picanto|rio)', 'hyundai i[12]0',
               'opel corsa', 'dacia sandero', 'skoda fabia', 'ford fiesta', 'mini']
fuels.hybrid = ['hybrid', 'h[ií]brido', 'phev']
fuels.electric = ['electric', 'el[eé]ctrico', 'ev', 'bev', 'tesla', 'zoe']
fuels.diesel = ['diesel', 'tdi', 'hdi', 'dci', 'gas[oó]leo']
fuels.petrol = ['petrol', 'benzin', 'gasoline', 'unleaded', 'lead.?free', 'sin plomo', '95', '98', 'e5', 'e10']

[cars.g_vkm]
small_petrol = [170, 183, 200]
small_diesel = [165, 177, 195]
small_hybrid = [130, 144, 160]
small_electric = [15, 70, 150]
average_petrol = [190, 209, 230]
average_diesel = [195, 215, 235]
average_hybrid = [145, 161, 180]
average_electric = [15, 75, 160]

[modes.taxi]
kind = "vehicle"
label = "taxi"
fuel = "diesel"
g_vkm = [150, 210, 260]
occupancy = [1.0, 1.4, 2.0]
grade = "D"
source = "[DESNZ 2025](https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2025) (taxi ≈ average car incl. empty running)"

[modes.ferry]
kind = "ship"
label = "ro-pax ferry (generic)"
fuel = "hfo"
kg_fuel_nm = [145, 170, 257]    # EU MRV 2024-25, Spain–Canaries ro-pax: Sicilia 145-162, Marie Curie 170, Volcán de Tinamar 245-257
seats = 1000
lf = [0.10, 0.20, 0.40]
trailers = [60, 100, 150]       # freight units per sailing on a freight-heavy line
cars = [20, 50, 90]
grade = "D"
source = "[EU MRV](https://mrv.emsa.europa.eu/) 2024-2025 (Spain–Canaries ro-pax)"

[modes.fast_ferry]
kind = "ship"
label = "fast ferry (generic)"
fuel = "mgo"
kg_fuel_nm = [130, 160, 214]    # EU MRV 2024-25, Fred. Olsen high-speed craft 139-214
seats = 860
lf = [0.21, 0.28, 0.35]         # MRV-derived average 21-31 %
vehicles = [40, 75, 110]
truck_share = [0.02, 0.05, 0.10]
grade = "D"
source = "[EU MRV](https://mrv.emsa.europa.eu/) 2024-2025 (Canary Islands high-speed craft)"

[modes.plane]
kind = "flight"
label = "plane"
grade = "C"

[modes.sail]
kind = "fuel"
label = "sailing yacht"
fuel = "marine_diesel"
l_per_100km = [1.0, 3.0, 8.0]   # motoring and charging: ~50-400 L per Atlantic crossing (estimate)
l_per_engine_h = [1.2, 2.5, 4.0]   # 40-50 ft yacht: ~1.2-1.5 L/h charging at fast idle, ~3-4 L/h motoring; generators ~1-2 L/h
occupancy = [4, 5.5, 7]         # crew; ARC 2025 averaged ~5.5
grade = "C"
source = "Estimate from the [ARC 2024 skipper survey](https://www.yachtingworld.com/arc/battery-power-onboard-hundreds-of-ocean-crossing-skippers-share-their-secrets-158731) (~3 h/day charging) and typical engine curves; [DESNZ 2025](https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2025) fuels"
# The dinghy is not transport here: add its outboard use to the leg's engine hours
# (~1-2 L/h against ~2.5 L/h, so about half an engine hour per hour of dinghy use).

[modes.bike]
kind = "zero"
label = "bike"
grade = "A"

[modes.walk]
kind = "zero"
label = "walk"
grade = "A"

[modes.other]
kind = "factor"
label = "other (generic)"
g_pkm = [20, 100, 250]
seats = 1
lf = 1
grade = "D"
source = "Placeholder: choose a specific mode where possible"

# -------------------------------------------------------------------- specific vehicles
