<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Costs · Flight-free travel</title>
<meta name="description" content="Travel costs in CHF by day, week, month, category and country.">
<meta name="theme-color" content="#0f1c28">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<script src="../vendor/d3.v7.9.0.min.js"></script>
<script type="module" src="../assets/costs.js"></script>
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="../">Flight-free travel</a>
  <nav class="nav" aria-label="Pages"><a href="../costs/" aria-current="page">Costs</a><a href="../emissions/">Emissions</a><a href="../method/">Method</a></nav>
  <button class="sync owner-only" id="sync-pill" type="button">Synced</button>
</div></header>

<main class="wrap">
  <section class="page-head">
    <div class="head-row">
      <div>
        <p class="kicker">All amounts in CHF</p>
        <h1>Costs</h1>
      </div>
      <button class="btn primary owner-only" id="add-btn" type="button">Add cost</button>
    </div>
  </section>

  <div class="filters">
    <div class="field"><label for="f-cat">Category</label><select id="f-cat" class="plain"></select></div>
    <div class="field"><label for="f-period">Period</label>
      <select id="f-period" class="plain">
        <option value="all">Whole trip</option>
        <option value="30">Last 30 days</option>
        <option value="month">This month</option>
      </select>
    </div>
  </div>

  <section class="kpis" id="kpis" aria-label="Key figures"></section>

  <section class="block" aria-labelledby="h-time">
    <h2 id="h-time">Over time</h2>
    <figure class="card">
      <div class="fig-head">
        <div class="seg" id="grain-seg" role="radiogroup" aria-label="Group by">
          <input type="radio" name="grain" id="g-day" value="day" checked><label for="g-day">Day</label>
          <input type="radio" name="grain" id="g-week" value="week"><label for="g-week">Week</label>
          <input type="radio" name="grain" id="g-month" value="month"><label for="g-month">Month</label>
        </div>
        <button class="tbtn" type="button" data-table="time" aria-pressed="false">Table</button>
      </div>
      <div class="chart" id="time-chart"></div>
      <div class="ftable" id="time-table" hidden></div>
    </figure>
  </section>

  <section class="block">
    <div class="two">
      <div>
        <h2 class="h2" id="h-cat">By category</h2>
        <figure class="card" aria-labelledby="h-cat">
          <div class="chart" id="cat-chart"></div>
        </figure>
      </div>
      <div>
        <h2 class="h2" id="h-country">By country</h2>
        <figure class="card" aria-labelledby="h-country">
          <div class="chart" id="country-chart"></div>
          <p class="explain">Per day = spent in that country ÷ days with at least one entry there.</p>
        </figure>
      </div>
    </div>
  </section>

  <section class="block owner-only" aria-labelledby="h-entries">
    <h2 id="h-entries">Entries</h2>
    <p class="lede">Tap an entry to change or delete it. Changes are saved to the repo; friends see them after the next build, about two minutes later.</p>
    <div id="entries"></div>
  </section>

  <footer class="end"><span id="foot"></span><a href="#" data-owner-link>Owner</a></footer>
</main>
<button class="fab owner-only" id="fab" type="button" aria-label="Add cost">+</button>
</body>
</html>
